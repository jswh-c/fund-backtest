# GitHub Actions — Streamlit App 自动部署工作流
# 推送代码到 main 分支时自动触发 Streamlit Cloud 重新部署
# 同时运行 lint 检查和单元测试

name: Deploy to Streamlit Cloud

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/*.csv"
      - "output/*"
      - "*.md"
      - ".gitignore"
      - "TEST_REPORT.md"
  workflow_dispatch: # 允许手动触发

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================
  # Job 1: 代码质量检查
  # ============================
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgconf-2-4 libgtk-3-0 fonts-wqy-microhei

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov black

      - name: Check code formatting (Black)
        run: black --check --diff --line-length 100 *.py tests/ 2>&1 || echo "[WARN] Formatting issues found (non-blocking)"

      - name: Syntax check all modules
        run: |
          python -c "
          import py_compile, sys
          files = ['app.py','backtest.py','strategies.py','data_fetcher.py','visualization.py','pdf_report.py','utils.py','main.py']
          errors = []
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              for e in errors: print(f'[FAIL] {e}')
              sys.exit(1)
          print('All 8 modules syntax OK')
          "

      - name: Run pytest
        run: |
          python -m pytest tests/ -v --tb=short --timeout=60 2>&1
        timeout-minutes: 3

      - name: Verify CLI entry
        run: |
          python -c "
          from data_fetcher import get_fund_data, batch_download_async_sync
          from backtest import FundBacktest, BacktestResult, run_batch_backtest
          from strategies import run_ml_rf_dca
          from utils import print_backtest_result, get_sort_column
          print('[OK] All core modules importable')
          "

  # ============================
  # Job 2: Streamlit 应用健康检查
  # ============================
  health-check:
    name: Streamlit Health Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgconf-2-4 fonts-wqy-microhei

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Start Streamlit & verify
        run: |
          # 后台启动 Streamlit
          streamlit run app.py --server.headless true --server.port 8501 &
          ST_PID=$!

          # 等待服务启动
          sleep 10

          # 检查进程是否仍在运行
          if kill -0 $ST_PID 2>/dev/null; then
            echo "[HEALTH CHECK] Streamlit server started successfully (PID: $ST_PID)"

            # 检查 HTTP 响应
            if command -v curl &> /dev/null; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8501/_stcore/health 2>/dev/null || echo "000")
              echo "[HEALTH CHECK] Health endpoint: HTTP $HTTP_CODE"
            fi

            # 停止服务
            kill $ST_PID 2>/dev/null || true
            echo "[HEALTH CHECK] Server stopped cleanly"
          else
            echo "[FAIL] Streamlit failed to start"
            exit 1
          fi
        timeout-minutes: 2
